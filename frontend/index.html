<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- The Ren'Py build's own icon (config.window_icon = "gui/window_icon.png"),
         so the web client is recognisably the same game in a tab strip. -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f9f8f3" />
    <meta name="description" content="Play an interactive visual novel, learn the craft with practical writing courses, and create scripts and novels in the Decalove writing studio." />
    <link rel="canonical" href="https://love.nevatal.id/" />
    <title>Decalove — Play, learn, write</title>
  </head>
  <body>
    <div id="root"></div>
    <!-- Before the bundle, and not a module: deployment settings have to exist by the
         time src/config.ts is evaluated. Generated from the environment at container
         start-up; a no-op in development. -->
    <script src="/config.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
