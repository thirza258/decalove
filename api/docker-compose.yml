## Decalove backend stack.
##
##   docker compose up -d                   full stack, API on :8000
##   docker compose up -d mongodb minio     just the infrastructure, run the API locally
##
## The API is playable without either service -- it falls back to in-memory storage
## and local asset files -- so this file is a convenience, not a prerequisite.

# Without this the project would be named after the directory ("api"), which makes
# the built image "api-api" and the network "api_default".
name: decalove

services:
  mongodb:
    image: mongo:7
    container_name: decalove-mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: rootpassword
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  minio:
    image: minio/minio
    container_name: decalove-minio
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # console
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: decalove-api
    container_name: decalove-api
    ports:
      - "8000:8000"
    environment:
      # Both are reachable by service name on the compose network, so require them
      # rather than letting the API silently fall back to in-memory storage here --
      # a container that quietly loses every save is worse than one that fails loudly.
      STORAGE_BACKEND: mongo
      ASSET_BACKEND: minio
      MONGODB_URL: mongodb://root:rootpassword@mongodb:27017
      MINIO_ENDPOINT: minio:9000
      CORS_ORIGINS: '["*"]'
      # Put OPENROUTER_API_KEY in a .env file next to this one to enable the LLM.
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      IMAGE_GENERATION_ENABLED: ${IMAGE_GENERATION_ENABLED:-False}
      # Set to "sdxl" to use local GPU-based Stable Diffusion XL instead of OpenRouter.
      IMAGE_BACKEND: ${IMAGE_BACKEND:-openrouter}
      # SDXL settings (only used when IMAGE_BACKEND=sdxl).
      SDXL_MODEL_ID: ${SDXL_MODEL_ID:-stabilityai/stable-diffusion-xl-base-1.0}
      SDXL_DEVICE: ${SDXL_DEVICE:-cuda}
      SDXL_TORCH_DTYPE: ${SDXL_TORCH_DTYPE:-float16}
      SDXL_NUM_INFERENCE_STEPS: ${SDXL_NUM_INFERENCE_STEPS:-30}
      SDXL_GUIDANCE_SCALE: ${SDXL_GUIDANCE_SCALE:-7.5}
      SDXL_NEGATIVE_PROMPT: ${SDXL_NEGATIVE_PROMPT:-}
      SDXL_ATTENTION_SLICING: ${SDXL_ATTENTION_SLICING:-True}
      SDXL_VAE_TILING: ${SDXL_VAE_TILING:-False}
      # Weights are stored under /srv/api/models/sdxl (a mounted volume).
      SDXL_MODEL_DIR: models/sdxl
      HF_HOME: /srv/api/models/sdxl
      TRANSFORMERS_CACHE: /srv/api/models/sdxl
    volumes:
      # Only used if ASSET_BACKEND falls back to local.
      - api_assets:/data/assets
      # Persists downloaded SDXL model weights across container rebuilds.
      - sdxl_models:/srv/api/models/sdxl
    depends_on:
      mongodb:
        condition: service_healthy
      minio:
        condition: service_healthy
    # Reserve the GPU for SDXL inference.  Docker requires the NVIDIA Container
    # Toolkit (nvidia-container-toolkit) to be installed on the host.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped

volumes:
  mongodb_data:
  minio_data:
  api_assets:
  sdxl_models:
